<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#030712">
    <title>Neon Tower Defense H5</title>
    <link rel="stylesheet" href="web/styles.css">
  </head>
  <body>
    <main class="game-shell">
      <canvas id="gameCanvas" aria-label="霓虹塔防游戏画布"></canvas>

      <section class="hud top-hud" aria-label="关卡状态">
        <div class="hud-line">
          <strong id="levelName">LEVEL 1</strong>
          <span id="waveInfo">WAVE 1 / 5</span>
          <span id="phaseInfo">普通敌人</span>
        </div>
        <div class="hud-line compact">
          <span id="heroInfo">Lv1</span>
          <span id="killInfo">击杀 0</span>
          <span id="skillInfo">经验 0 / 8</span>
        </div>
      </section>

      <section class="hud side-hud" aria-label="血量状态">
        <div id="skillPoolInfo">宝箱 120 / 120</div>
        <div id="enemyHpInfo">敌人 0</div>
        <div id="dropInfo">金币 0</div>
        <div id="economyInfo">持有金币 0｜抽奖券 0</div>
        <button id="fighterButton" class="hud-button" type="button">战机库</button>
        <button id="exitGameButton" class="hud-button danger" type="button">退出游戏</button>
      </section>

      <section class="controls" aria-label="移动控制">
        <button id="moveLeft" type="button" aria-label="向左移动">左</button>
        <button id="moveRight" type="button" aria-label="向右移动">右</button>
      </section>

      <section id="mainMenu" class="main-menu" aria-label="主界面" hidden>
        <div class="main-menu-panel">
          <header class="main-account">
            <span>本地账号</span>
            <strong id="accountFighter">基础战机</strong>
            <div class="account-stats">
              <span id="accountCoins">金币 0</span>
              <span id="accountTickets">抽奖券 0</span>
              <span id="accountUnlocked">战机 1 / 8</span>
            </div>
          </header>
          <div class="main-actions">
            <button id="mainStartButton" type="button">开始游戏</button>
            <button id="fighterInfoButton" type="button">战机信息</button>
          </div>
        </div>
      </section>

      <dialog id="resultDialog" class="result-dialog">
        <div class="dialog-panel">
          <h1 id="resultTitle">通关</h1>
          <p id="resultText">阶段完成</p>
          <div class="dialog-actions">
            <button id="retryButton" type="button">重试</button>
            <button id="nextButton" type="button">下一关</button>
          </div>
        </div>
      </dialog>

      <dialog id="exitDialog" class="result-dialog">
        <div class="dialog-panel">
          <h1>退出游戏</h1>
          <p>退出后本局金币和抽奖券不会结算。</p>
          <div class="dialog-actions">
            <button id="exitCancelButton" type="button">取消</button>
            <button id="exitConfirmButton" type="button">确认退出</button>
          </div>
        </div>
      </dialog>

      <dialog id="fighterDialog" class="fighter-dialog">
        <div class="fighter-panel">
          <div class="fighter-heading">
            <span id="fighterSource">战机选择</span>
            <strong>选择战机</strong>
            <span id="fighterWallet">金币 0｜券 0</span>
          </div>
          <div id="fighterCarousel" class="fighter-carousel">
            <button id="fighterPrevButton" class="fighter-nav" type="button" aria-label="上一架战机">‹</button>
            <div id="fighterTrack" class="fighter-track"></div>
            <button id="fighterNextButton" class="fighter-nav" type="button" aria-label="下一架战机">›</button>
          </div>
          <div id="fighterDots" class="fighter-dots" aria-label="战机位置"></div>
          <div class="fighter-actions">
            <button id="drawFighterButton" type="button">返回主界面</button>
            <button id="startFighterButton" type="button">开始游戏</button>
          </div>
        </div>
      </dialog>

      <section id="fighterInfoPage" class="page-view fighter-info-page" aria-label="战机信息" hidden>
        <div class="page-panel fighter-info-panel">
          <div class="page-heading">
            <span id="fighterInfoSource">战机档案</span>
            <strong>战机信息</strong>
            <span id="fighterInfoWallet">金币 0｜券 0</span>
          </div>
          <div class="fighter-carousel">
            <button id="fighterInfoPrevButton" class="fighter-nav" type="button" aria-label="上一架战机">‹</button>
            <div id="fighterInfoTrack" class="fighter-track"></div>
            <button id="fighterInfoNextButton" class="fighter-nav" type="button" aria-label="下一架战机">›</button>
          </div>
          <div id="fighterInfoDots" class="fighter-dots" aria-label="战机信息位置"></div>
          <div class="fighter-actions">
            <button id="fighterInfoCloseButton" type="button">返回主界面</button>
            <button id="fighterUpgradeButton" type="button">升级</button>
          </div>
        </div>
      </section>

      <section id="fighterUpgradePage" class="page-view fighter-upgrade-page" aria-label="战机升级" hidden>
        <div class="page-panel fighter-upgrade-panel">
          <button id="fighterUpgradeBackButton" class="page-back-button" type="button">返回</button>
          <div class="page-heading">
            <span id="fighterUpgradeSource">升级中心</span>
            <strong id="fighterUpgradeTitle">基础战机</strong>
            <span id="fighterUpgradeWallet">金币 0｜券 0</span>
          </div>
          <div id="fighterUpgradeTrack" class="upgrade-grid"></div>
        </div>
      </section>

      <dialog id="choiceDialog" class="choice-dialog">
        <div class="choice-panel">
          <div class="choice-heading">
            <span id="choiceSource">宝箱奖励</span>
            <strong id="choiceTitle">选择奖励</strong>
            <span id="choiceCount">1 / 1</span>
          </div>
          <div id="choiceCards" class="choice-cards"></div>
        </div>
      </dialog>

      <dialog id="giftDialog" class="gift-dialog">
        <div class="gift-panel">
          <div id="celebrationLayer" class="celebration-layer" aria-hidden="true"></div>
          <div class="gift-heading">
            <span id="giftSource">宝箱已击碎</span>
            <strong id="giftTitle">选择一个宝箱</strong>
            <span id="giftCount">1 / 1</span>
          </div>
          <div id="giftItems" class="gift-items"></div>
        </div>
      </dialog>
    </main>

    <script src="web/config.js" defer></script>
    <script src="web/progress.js" defer></script>
    <script src="web/rewards.js" defer></script>
    <script src="web/game.js" defer></script>
  </body>
</html>
